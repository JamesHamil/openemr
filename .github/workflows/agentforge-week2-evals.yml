name: AgentForge Week 2 Evals

on:
  pull_request:
    paths:
      - "agentforge/**"
      - "interface/modules/custom_modules/agentforge/**"
      - "templates/documents/general_view.html"
      - ".github/workflows/agentforge-week2-evals.yml"
  push:
    branches:
      - master
      - main
    paths:
      - "agentforge/**"
      - "interface/modules/custom_modules/agentforge/**"
      - "templates/documents/general_view.html"
      - ".github/workflows/agentforge-week2-evals.yml"

jobs:
  week2-evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sidecar dependencies
        run: python -m pip install -r agentforge/sidecar/requirements.txt

      - name: Run sidecar unit tests
        env:
          PYTHONPATH: agentforge/sidecar
          AGENTFORGE_MODE: mock
          AGENTFORGE_LANGFUSE_ENABLED: "false"
        run: python -m unittest discover -s agentforge/sidecar/tests

      - name: Run Week 2 evals
        env:
          PYTHONPATH: agentforge/sidecar
          AGENTFORGE_MODE: mock
          AGENTFORGE_EVAL_MODE: mock
          AGENTFORGE_LANGFUSE_ENABLED: "false"
        run: python agentforge/evals/run_week2_evals.py --json > week2-eval-results.json

      - name: Enforce Week 2 eval threshold
        run: python agentforge/evals/enforce_week2_gate.py week2-eval-results.json --baseline agentforge/evals/week2_baseline.json

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: week2-eval-results
          path: week2-eval-results.json
